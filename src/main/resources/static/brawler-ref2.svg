  <rect x="106" y="150" width="22" height="42" rx="8" fill="#0a2a2e"/>
  <ellipse cx="83" cy="194" rx="16" ry="8" fill="#071a1c"/>
  <ellipse cx="117" cy="194" rx="16" ry="8" fill="#071a1c"/>

